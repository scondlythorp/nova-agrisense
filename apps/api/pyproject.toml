[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-agrisense-api"
version = "0.2.0"
description = "Nova AgriSense multi-tenant agricultural intelligence FastAPI backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic[email]>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "alembic>=1.14.0,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "geoalchemy2>=0.15.2,<1.0.0",
  "shapely>=2.0.6,<3.0.0",
  "pandas>=2.2.3,<3.0.0",
  "numpy>=1.26.4,<3.0.0",
  "argon2-cffi>=23.1.0,<25.0.0",
  "pyjwt>=2.9.0,<3.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "openpyxl>=3.1.5,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "httpx>=0.27.2,<1.0.0",
  "ruff>=0.7.0,<1.0.0",
]
ml = [
  "scikit-learn>=1.5.2,<2.0.0",
  "geopandas>=1.0.1,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
